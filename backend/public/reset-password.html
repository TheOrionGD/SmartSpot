<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpot — Reset Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus: #6366f1;
            --error: #ef4444;
            --success: #10b981;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Blobs */
        .ambient-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .blob-1 {
            top: 10%;
            left: 15%;
            background: #6366f1;
        }

        .blob-2 {
            bottom: 10%;
            right: 15%;
            background: #a855f7;
        }

        /* Container Card */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px var(--primary-glow);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Icon & Branding */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px auto;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .icon-badge svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Steps Indicator */
        .steps-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            width: 28px;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 20px;
            height: 20px;
            stroke: var(--text-muted);
            stroke-width: 2;
            fill: none;
            pointer-events: none;
            transition: stroke 0.3s ease;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .input-field:focus + .input-icon {
            stroke: var(--primary);
        }

        .toggle-pwd {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-pwd svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-muted);
            stroke-width: 2;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .toggle-pwd:hover svg {
            stroke: var(--text-main);
        }

        /* Question Banner Box */
        .question-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #c7d2fe;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .question-box svg {
            width: 20px;
            height: 20px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
            margin-top: 2px;
        }

        /* Password Strength Meter */
        .strength-meter {
            height: 4px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px var(--primary-glow);
            filter: brightness(1.08);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast / Alert Message */
        .toast {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .toast svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }

        .toast.error svg { stroke: var(--error); }
        .toast.success svg { stroke: var(--success); }

        .hidden {
            display: none !important;
        }

        .footer-link {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .footer-link a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div class="card">
        <div class="header">
            <div class="icon-badge">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1 class="title" id="cardTitle">Forgot Password?</h1>
            <p class="subtitle" id="cardSubtitle">Enter your registered email address to locate your security recovery question.</p>
        </div>

        <div class="steps-bar">
            <div class="step-dot active" id="dotStep1"></div>
            <div class="step-dot" id="dotStep2"></div>
        </div>

        <div id="toastMessage" class="toast">
            <svg id="toastIcon" viewBox="0 0 24 24"></svg>
            <span id="toastText"></span>
        </div>

        <!-- Step 1: Find Account -->
        <form id="step1Form" onsubmit="handleFindAccount(event)">
            <div class="form-group">
                <label class="label" for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="input-field" placeholder="name@example.com" required autocomplete="email">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
            </div>

            <button type="submit" id="btnStep1" class="btn-submit">
                <div class="spinner" id="spinStep1"></div>
                <span id="textStep1">Find Security Question</span>
            </button>
        </form>

        <!-- Step 2: Answer Security Question & Set New Password -->
        <form id="step2Form" class="hidden" onsubmit="handleResetPassword(event)">
            <div class="question-box">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span id="displayQuestion">Security Question loading...</span>
            </div>

            <div class="form-group">
                <label class="label" for="securityAnswer">Your Answer</label>
                <div class="input-wrapper">
                    <input type="text" id="securityAnswer" class="input-field" placeholder="Enter your answer" required>
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label class="label" for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" class="input-field" placeholder="At least 6 characters" required oninput="checkStrength(this.value)">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('newPassword', 'eyeIcon1')">
                        <svg id="eyeIcon1" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="strength-meter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="label" for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter new password" required>
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('confirmPassword', 'eyeIcon2')">
                        <svg id="eyeIcon2" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnStep2" class="btn-submit">
                <div class="spinner" id="spinStep2"></div>
                <span id="textStep2">Reset Password</span>
            </button>
        </form>

        <div class="footer-link">
            Remembered your password? <a href="/login" id="loginLink">Sign In</a>
        </div>
    </div>

    <script>
        let currentEmail = '';

        function showToast(message, isSuccess = false) {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            toast.className = `toast ${isSuccess ? 'success' : 'error'}`;
            toastText.textContent = message;

            if (isSuccess) {
                toastIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
            } else {
                toastIcon.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
            }

            toast.style.display = 'flex';
        }

        function hideToast() {
            document.getElementById('toastMessage').style.display = 'none';
        }

        function togglePasswordVisibility(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                field.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function checkStrength(val) {
            const bar = document.getElementById('strengthBar');
            if (!val) {
                bar.style.width = '0%';
                return;
            }
            let score = 0;
            if (val.length >= 6) score += 33;
            if (val.length >= 10) score += 33;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score += 34;

            bar.style.width = `${score}%`;
            if (score <= 33) {
                bar.style.backgroundColor = '#ef4444';
            } else if (score <= 66) {
                bar.style.backgroundColor = '#f59e0b';
            } else {
                bar.style.backgroundColor = '#10b981';
            }
        }

        async function handleFindAccount(e) {
            e.preventDefault();
            hideToast();

            const emailInput = document.getElementById('email');
            currentEmail = emailInput.value.trim();

            if (!currentEmail) {
                showToast('Please enter a valid email address');
                return;
            }

            const btn = document.getElementById('btnStep1');
            const spin = document.getElementById('spinStep1');
            const text = document.getElementById('textStep1');

            btn.disabled = true;
            spin.style.display = 'block';
            text.textContent = 'Searching...';

            try {
                const res = await fetch('/api/auth/security-question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Failed to retrieve security question');
                }

                // Switch to Step 2
                document.getElementById('displayQuestion').textContent = data.securityQuestion;
                document.getElementById('step1Form').classList.add('hidden');
                document.getElementById('step2Form').classList.remove('hidden');

                document.getElementById('dotStep1').classList.remove('active');
                document.getElementById('dotStep2').classList.add('active');

                document.getElementById('cardTitle').textContent = 'Verify Account';
                document.getElementById('cardSubtitle').textContent = `Please answer your security question to reset password for ${currentEmail}`;
            } catch (err) {
                showToast(err.message || 'Unable to connect to server');
            } finally {
                btn.disabled = false;
                spin.style.display = 'none';
                text.textContent = 'Find Security Question';
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            hideToast();

            const answer = document.getElementById('securityAnswer').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!answer) {
                showToast('Please answer your security question');
                return;
            }

            if (newPassword.length < 6) {
                showToast('New password must be at least 6 characters');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match');
                return;
            }

            const btn = document.getElementById('btnStep2');
            const spin = document.getElementById('spinStep2');
            const text = document.getElementById('textStep2');

            btn.disabled = true;
            spin.style.display = 'block';
            text.textContent = 'Resetting Password...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        securityAnswer: answer,
                        newPassword: newPassword
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Failed to reset password');
                }

                showToast('Password reset successfully! Redirecting...', true);
                
                setTimeout(() => {
                    window.location.reload();
                }, 2500);

            } catch (err) {
                showToast(err.message || 'Failed to reset password');
            } finally {
                btn.disabled = false;
                spin.style.display = 'none';
                text.textContent = 'Reset Password';
            }
        }
    </script>
</body>
</html>
