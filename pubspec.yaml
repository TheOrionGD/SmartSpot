name: smartspot
description: "SmartSpot - Location-Based Reminder App (Phase 1)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  sqflite: ^2.2.8+4
  path: ^1.8.3
  uuid: ^4.0.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  flutter_map: ^7.0.2
  http: ^1.2.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0B"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true